[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-master"
version = "0.1.0"
description = "Caméra virtuelle déclenchée par gestes pour les réunions en ligne"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
gestures = [
    "mediapipe>=0.10.21,<1.0",
]
virtual-camera = [
    "pyvirtualcam>=0.15,<1.0",
]

[project.scripts]
meet-master = "meet_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
